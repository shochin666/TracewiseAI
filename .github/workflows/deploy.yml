# ねじメッキ工程システムを Azure Container Apps へ自動デプロイする（環境別）。
#
#   ブランチ           GitHub Environment   既定リソース
#   develop  ─►        development          tracewise-dev-rg  / tracewise-dev-*
#   main     ─►        production           tracewise-prod-rg / tracewise-prod-*  ※今は未使用
#
# 当面は開発(dev)環境のみ運用するため、トリガは develop ブランチのみ。
# 本番(prod)を追加するときは:
#   1) 下の branches に 'main' を追記
#   2) GitHub Environment 'production' を作成し、Variables: RESOURCE_GROUP / NAME_PREFIX を設定
#   3) ENVIRONMENT=production bash infra/setup-azure-oidc.sh を実行
#
# 事前準備（dev・1回だけ）:
#   1) GitHub の Settings → Environments で 'development' を作成し、Variables を設定
#         RESOURCE_GROUP = tracewise-dev-rg
#         NAME_PREFIX    = tracewise-dev
#   2) ENVIRONMENT=development bash infra/setup-azure-oidc.sh を実行
#      → 出力された3値を Settings → Secrets and variables → Actions の
#        Repository secrets に登録
#         AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
name: Deploy to Azure Container Apps

on:
  push:
    branches: [develop] # prodを追加するときは ['develop', 'main'] に
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {} # 手動実行も可能

permissions:
  id-token: write # OIDC トークン取得に必須
  contents: read

env:
  LOCATION: japaneast # 全環境共通

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ブランチ → GitHub Environment マップ（main=production / それ以外=development）。
    # 当面 main はトリガに含めないため develop だけが development を使う。
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      # 環境ごとに分離（GitHub Environment の Variables から注入）。
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Azure へログイン（OIDC）
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 環境設定を確認
        run: |
          echo "Environment   : ${{ github.ref_name == 'main' && 'production' || 'development' }}"
          echo "ResourceGroup : $RESOURCE_GROUP"
          echo "NamePrefix    : $NAME_PREFIX"
          [ -n "$RESOURCE_GROUP" ] && [ -n "$NAME_PREFIX" ] || {
            echo "::error::GitHub Environment の Variables (RESOURCE_GROUP / NAME_PREFIX) が未設定です。"
            exit 1
          }

      - name: リソースグループ作成（冪等）
        run: az group create -n "$RESOURCE_GROUP" -l "$LOCATION" -o none

      - name: 基盤デプロイ（platform.bicep）
        id: platform
        run: |
          outputs=$(az deployment group create \
            -g "$RESOURCE_GROUP" \
            -n "platform-${{ github.run_number }}" \
            -f infra/platform.bicep \
            -p namePrefix="$NAME_PREFIX" location="$LOCATION" \
            --query properties.outputs -o json)
          echo "acrName=$(echo "$outputs" | jq -r .acrName.value)" >> "$GITHUB_OUTPUT"
          echo "acrLoginServer=$(echo "$outputs" | jq -r .acrLoginServer.value)" >> "$GITHUB_OUTPUT"
          echo "envId=$(echo "$outputs" | jq -r .envId.value)" >> "$GITHUB_OUTPUT"
          echo "envDefaultDomain=$(echo "$outputs" | jq -r .envDefaultDomain.value)" >> "$GITHUB_OUTPUT"
          echo "envStorageName=$(echo "$outputs" | jq -r .envStorageName.value)" >> "$GITHUB_OUTPUT"
          echo "pullIdentityId=$(echo "$outputs" | jq -r .pullIdentityId.value)" >> "$GITHUB_OUTPUT"

      - name: イメージタグと backend オリジンを決定
        id: vars
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # backend の内部 FQDN は <app>.internal.<env既定ドメイン> で決定論的に決まる。
          echo "backendOrigin=https://${NAME_PREFIX}-backend.internal.${{ steps.platform.outputs.envDefaultDomain }}" >> "$GITHUB_OUTPUT"

      - name: backend イメージを ACR でビルド＆プッシュ
        run: |
          az acr build \
            -r "${{ steps.platform.outputs.acrName }}" \
            -t "${NAME_PREFIX}-backend:${{ steps.vars.outputs.tag }}" \
            -t "${NAME_PREFIX}-backend:latest" \
            -f backend/Dockerfile.prod \
            backend

      - name: frontend イメージを ACR でビルド＆プッシュ（プロキシ先を build-arg 注入）
        run: |
          # NODE_ENV=production のためブラウザは同一オリジンの /api を叩く（相対）。
          # BACKEND_ORIGIN → Next.js の rewrites が backend(内部) へ中継する宛先（ビルド時に焼き込む）。
          az acr build \
            -r "${{ steps.platform.outputs.acrName }}" \
            -t "${NAME_PREFIX}-frontend:${{ steps.vars.outputs.tag }}" \
            -t "${NAME_PREFIX}-frontend:latest" \
            -f frontend/Dockerfile.prod \
            --build-arg BACKEND_ORIGIN="${{ steps.vars.outputs.backendOrigin }}" \
            frontend

      - name: アプリデプロイ（apps.bicep）
        id: apps
        run: |
          loginServer="${{ steps.platform.outputs.acrLoginServer }}"
          tag="${{ steps.vars.outputs.tag }}"
          outputs=$(az deployment group create \
            -g "$RESOURCE_GROUP" \
            -n "apps-${{ github.run_number }}" \
            -f infra/apps.bicep \
            -p namePrefix="$NAME_PREFIX" \
               location="$LOCATION" \
               envId="${{ steps.platform.outputs.envId }}" \
               acrLoginServer="$loginServer" \
               pullIdentityId="${{ steps.platform.outputs.pullIdentityId }}" \
               envStorageName="${{ steps.platform.outputs.envStorageName }}" \
               backendImage="$loginServer/${NAME_PREFIX}-backend:$tag" \
               frontendImage="$loginServer/${NAME_PREFIX}-frontend:$tag" \
            --query properties.outputs -o json)
          echo "frontendUrl=$(echo "$outputs" | jq -r .frontendUrl.value)" >> "$GITHUB_OUTPUT"

      - name: デプロイ結果を表示
        run: |
          {
            echo "### デプロイ完了 :rocket:"
            echo ""
            echo "- Environment : \`${{ github.ref_name == 'main' && 'production' || 'development' }}\`"
            echo "- ResourceGroup: \`$RESOURCE_GROUP\`"
            echo "- フロントエンド: ${{ steps.apps.outputs.frontendUrl }}"
            echo "- イメージタグ : \`${{ steps.vars.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
